<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to Lumen AI to manage your 3D commerce experiences." />
    <title>Login | Lumen AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <div data-site-header></div>

    <main class="auth-page">
      <div class="container">
        <div class="auth-card reveal">
          <div class="section-header">
            <span class="eyebrow">Welcome back</span>
            <h2>Sign in to your workspace.</h2>
          </div>
          <form id="login-form" novalidate>
            <label>
              Email
              <input id="login-email" type="email" placeholder="you@company.com" required />
            </label>
            <label>
              Password
              <input id="login-password" type="password" placeholder="••••••••" required />
            </label>
            <p id="login-message" role="status" aria-live="polite" style="margin-bottom: 0.8rem; color: var(--muted);"></p>
            <button class="btn btn-primary" type="submit" style="width: 100%;">Log in</button>
          </form>
          <div class="auth-links">
            <a href="signup.html">Create account</a>
            <a href="contact.html">Need help?</a>
          </div>
        </div>
      </div>
    </main>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="config.js"></script>
    <script src="components.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
    
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        // Redirect if already logged in
        if (window.isAuthenticated && window.isAuthenticated()) {
          window.location.href = 'profile.html';
          return;
        }

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const messageEl = document.getElementById('login-message');
        const submitBtn = form?.querySelector('button[type="submit"]');

        form?.addEventListener('submit', async (event) => {
          event.preventDefault();

          // Reset message
          messageEl.textContent = '';
          messageEl.style.color = 'var(--muted)';

          // Show loading state
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';
          }

          try {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            const result = await window.loginUser(email, password);

            if (result.success) {
              messageEl.textContent = `Welcome back, ${result.user.name}!`;
              messageEl.style.color = '#8cf7c2';
              
              // Redirect after short delay
              setTimeout(() => {
                window.location.href = 'profile.html';
              }, 1000);
            } else {
              messageEl.textContent = result.error || 'Login failed. Please try again.';
              messageEl.style.color = '#ff9c9c';

              // Reset button
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log in';
              }
            }
          } catch (error) {
            console.error('Login error:', error);
            messageEl.textContent = 'An unexpected error occurred. Please try again.';
            messageEl.style.color = '#ff9c9c';

            // Reset button
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Log in';
            }
          }
        });
      });
    </script>
  </body>
</html>
