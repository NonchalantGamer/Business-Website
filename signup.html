<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your Cosmo3D account to launch immersive 3D commerce experiences." />
    <title>Sign Up | Cosmo3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="signup">
    <div data-site-header></div>

    <main class="auth-page">
      <div class="container">
        <div class="auth-card reveal">
          <div class="section-header">
            <span class="eyebrow">Start free</span>
            <h2>Create your Cosmo3D account.</h2>
          </div>
          <button type="button" id="google-signup-btn" class="btn btn-secondary" style="width: 100%; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; padding: 0.75rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 500;">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Sign up with Google
          </button>
          
          <div style="text-align: center; margin-bottom: 1rem; color: var(--muted); font-size: 0.875rem;">or use email</div>
          <form id="signup-form" novalidate>
            <label>
              Full name
              <input id="signup-name" type="text" placeholder="Alex Rivera" required />
            </label>
            <label>
              Email
              <input id="signup-email" type="email" placeholder="you@company.com" required />
            </label>
            <label>
              Password
              <input id="signup-password" type="password" placeholder="Create a strong password" required />
            </label>
            <label>
              Confirm Password
              <input id="signup-password-confirm" type="password" placeholder="Confirm your password" required />
            </label>
            <p id="signup-message" role="status" aria-live="polite" style="margin-bottom: 0.8rem; color: var(--muted);"></p>
            <button class="btn btn-primary" type="submit" style="width: 100%;">Create account</button>
          </form>
          <div class="auth-links">
            <a href="login.html">Have an account?</a>
            <a href="contact.html">Need help?</a>
          </div>
        </div>
      </div>
    </main>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="config.js"></script>
    <script src="components.js?v=3"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
    
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        // Redirect if already logged in
        if (window.isAuthenticated && window.isAuthenticated()) {
          window.location.href = 'profile.html';
          return;
        }

        const googleBtn = document.getElementById('google-signup-btn');
        googleBtn?.addEventListener('click', async () => {
          if (!window.loginWithGoogle) {
            console.error('loginWithGoogle function is missing from auth.js');
            messageEl.textContent = 'Google sign-in is unavailable right now.';
            messageEl.style.color = '#ff9c9c';
            return;
          }

          googleBtn.disabled = true;
          googleBtn.textContent = 'Connecting to Google...';

          try {
            const result = await window.loginWithGoogle({ redirectPath: 'profile.html' });
            if (!result?.success) {
              messageEl.textContent = result?.error || 'Google sign-in failed. Please try again.';
              messageEl.style.color = '#ff9c9c';
              googleBtn.disabled = false;
              googleBtn.textContent = 'Continue with Google';
            }
          } catch (error) {
            console.error('Google sign-in error:', error);
            messageEl.textContent = 'Google sign-in failed. Please try again.';
            messageEl.style.color = '#ff9c9c';
            googleBtn.disabled = false;
            googleBtn.textContent = 'Continue with Google';
          }
        });

        const form = document.getElementById('signup-form');
        const nameInput = document.getElementById('signup-name');
        const emailInput = document.getElementById('signup-email');
        const passwordInput = document.getElementById('signup-password');
        const passwordConfirmInput = document.getElementById('signup-password-confirm');
        const messageEl = document.getElementById('signup-message');
        const submitBtn = form?.querySelector('button[type="submit"]');

        form?.addEventListener('submit', async (event) => {
          event.preventDefault();

          // Reset message
          messageEl.textContent = '';
          messageEl.style.color = 'var(--muted)';

          // Show loading state
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
          }

          try {
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const passwordConfirm = passwordConfirmInput.value;

            const result = await window.signupUser({
              name,
              email,
              password,
              passwordConfirm,
            });

            if (result.success) {
              messageEl.textContent = result.message || `Account created for ${result.user.name}! Redirecting...`;
              messageEl.style.color = '#8cf7c2';
              
              // Redirect after short delay
              setTimeout(() => {
                window.location.href = 'profile.html';
              }, 2000);
            } else {
              messageEl.textContent = result.error || 'Signup failed. Please try again.';
              messageEl.style.color = '#ff9c9c';

              // Reset button
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create account';
              }
            }
          } catch (error) {
            console.error('Signup error:', error);
            messageEl.textContent = 'An unexpected error occurred. Please try again.';
            messageEl.style.color = '#ff9c9c';

            // Reset button
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Create account';
            }
          }
        });
      });
    </script>
  </body>
</html>
