<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your Lumen AI account to launch immersive 3D commerce experiences." />
    <title>Sign Up | Lumen AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="signup">
    <div data-site-header></div>

    <main class="auth-page">
      <div class="container">
        <div class="auth-card reveal">
          <div class="section-header">
            <span class="eyebrow">Start free</span>
            <h2>Create your Lumen AI account.</h2>
          </div>
          <form id="signup-form" novalidate>
            <label>
              Full name
              <input id="signup-name" type="text" placeholder="Alex Rivera" required />
            </label>
            <label>
              Email
              <input id="signup-email" type="email" placeholder="you@company.com" required />
            </label>
            <label>
              Password
              <input id="signup-password" type="password" placeholder="Create a strong password" required />
            </label>
            <label>
              Confirm Password
              <input id="signup-password-confirm" type="password" placeholder="Confirm your password" required />
            </label>
            <p id="signup-message" role="status" aria-live="polite" style="margin-bottom: 0.8rem; color: var(--muted);"></p>
            <button class="btn btn-primary" type="submit" style="width: 100%;">Create account</button>
          </form>
          <div class="auth-links">
            <a href="login.html">Have an account?</a>
            <a href="contact.html">Need help?</a>
          </div>
        </div>
      </div>
    </main>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="config.js"></script>
    <script src="components.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
    
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        // Redirect if already logged in
        if (window.isAuthenticated && window.isAuthenticated()) {
          window.location.href = 'profile.html';
          return;
        }

        const form = document.getElementById('signup-form');
        const nameInput = document.getElementById('signup-name');
        const emailInput = document.getElementById('signup-email');
        const passwordInput = document.getElementById('signup-password');
        const passwordConfirmInput = document.getElementById('signup-password-confirm');
        const messageEl = document.getElementById('signup-message');
        const submitBtn = form?.querySelector('button[type="submit"]');

        form?.addEventListener('submit', async (event) => {
          event.preventDefault();

          // Reset message
          messageEl.textContent = '';
          messageEl.style.color = 'var(--muted)';

          // Show loading state
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
          }

          try {
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const passwordConfirm = passwordConfirmInput.value;

            const result = await window.signupUser({
              name,
              email,
              password,
              passwordConfirm,
            });

            if (result.success) {
              messageEl.textContent = result.message || `Account created for ${result.user.name}! Redirecting...`;
              messageEl.style.color = '#8cf7c2';
              
              // Redirect after short delay
              setTimeout(() => {
                window.location.href = 'profile.html';
              }, 2000);
            } else {
              messageEl.textContent = result.error || 'Signup failed. Please try again.';
              messageEl.style.color = '#ff9c9c';

              // Reset button
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create account';
              }
            }
          } catch (error) {
            console.error('Signup error:', error);
            messageEl.textContent = 'An unexpected error occurred. Please try again.';
            messageEl.style.color = '#ff9c9c';

            // Reset button
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Create account';
            }
          }
        });
      });
    </script>
  </body>
</html>
