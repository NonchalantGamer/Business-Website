<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to Lumen AI to manage your 3D commerce experiences." />
    <title>Login | Lumen AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <div data-site-header></div>

    <main class="auth-page">
      <div class="container">
        <div class="auth-card reveal">
          <div class="section-header">
            <span class="eyebrow">Welcome back</span>
            <h2>Sign in to your workspace.</h2>
          </div>
          <form id="login-form" novalidate>
            <label>
              Email
              <input id="login-email" type="email" placeholder="you@company.com" required />
            </label>
            <label>
              Password
              <input id="login-password" type="password" placeholder="••••••••" required />
            </label>
            <p id="login-message" role="status" aria-live="polite" style="margin-bottom: 0.8rem; color: var(--muted);"></p>
            <button class="btn btn-primary" type="submit" style="width: 100%;">Log in</button>
          </form>
          <div class="auth-links">
            <a href="signup.html">Create account</a>
            <a href="contact.html">Need help?</a>
          </div>
        </div>
      </div>
    </main>

    <script src="components.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('login-form');
        const message = document.getElementById('login-message');

        form?.addEventListener('submit', (event) => {
          event.preventDefault();
          const email = document.getElementById('login-email').value;
          const password = document.getElementById('login-password').value;
          const session = window.loginUser(email, password);

          if (session) {
            message.textContent = `Welcome back, ${session.name}!`;
            message.style.color = '#8cf7c2';
            window.location.href = 'index.html';
          } else {
            message.textContent = 'Invalid email or password.';
            message.style.color = '#ff9c9c';
          }
        });
      });
    </script>
  </body>
</html>
